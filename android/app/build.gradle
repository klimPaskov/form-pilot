plugins {
    id "com.android.application"
}

android {
    namespace "dev.formpilot.helper"
    compileSdk 35

    defaultConfig {
        applicationId "dev.formpilot.helper"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "0.7.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK can be sideloaded; this app is not built for a store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ["META-INF/*.kotlin_module", "META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*", "META-INF/INDEX.LIST", "META-INF/versions/9/OSGI-INF/MANIFEST.MF"]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "com.anthropic:anthropic-java:3.3.0"
}
